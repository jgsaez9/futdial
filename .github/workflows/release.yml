name: Release

# Al subir un tag vX.Y.Z se crea la release de GitHub.
# HACS detecta la nueva release y la ofrece como actualización.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar que el tag coincide con manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(jq -r .version custom_components/futdial/manifest.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::El tag ($TAG) no coincide con la versión de manifest.json ($VERSION)"
            exit 1
          fi

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "FutDial $GITHUB_REF_NAME" --generate-notes
