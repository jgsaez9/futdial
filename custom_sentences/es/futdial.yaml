# Copia este fichero a /config/custom_sentences/es/futdial.yaml
# y reinicia Home Assistant para poder preguntar a Assist:
#   "¿En qué canal echan el Atleti?"
#   "¿Dónde ponen el Betis Sevilla?"
#   "¿Qué dial es el partido del Barça?"
language: "es"
intents:
  FutDialBuscarPartido:
    data:
      - sentences:
          - "[en] (qué|que) (canal|dial) (echan|ponen|dan|emiten|televisan|retransmiten|juega|es|va) [el|la] [partido] [del|de|de la|al] {partido}"
          - "(dónde|donde) (echan|ponen|dan|emiten|televisan|retransmiten|juega|veo|puedo ver) [el|la|al] [partido] [del|de|de la] {partido}"
          - "(canal|dial) [del|de|de la] [partido] [del|de|de la] {partido}"
lists:
  partido:
    wildcard: true
